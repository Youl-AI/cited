ignoredBuiltDependencies:
  # @sentry/cli의 postinstall은 플랫폼 바이너리를 내려받는 "폴백"이다. 실제
  # 바이너리는 optionalDependencies(@sentry/cli-win32-x64 등)로 이미 들어오므로
  # 스크립트를 건너뛰어도 나중에 소스맵 업로드가 깨지지 않는다 (설치된 트리에서
  # sentry-cli.exe 존재를 확인함). 승인 목록에 넣으면 CI 설치마다 불필요한
  # 다운로드가 붙는다.
  - '@sentry/cli'
  - sharp
  - unrs-resolver
