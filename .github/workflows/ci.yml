name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 버전을 여기 적지 않는다. package.json의 `packageManager` 필드가 진실의
      # 원천이고, 여기에도 적으면 action이 "Multiple versions of pnpm specified"로
      # 실패한다. 두 곳에 적으면 드리프트도 생긴다.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # 스키마 테스트는 getTableConfig로 메모리상의 drizzle 설정만 읽고 drizzle/*.sql은
      # 절대 읽지 않는다. 그래서 schema.ts를 고치고 `pnpm db:generate`를 잊으면 테스트는
      # 전부 초록인데 DB에 적용되는 마이그레이션만 낡은 채로 남는다. generate를 다시 돌려
      # drizzle/ 트리가 더러워지면(= 커밋된 마이그레이션이 최신이 아니면) 여기서 막는다.
      # drizzle-kit generate는 DB에 접속하지 않으므로 DATABASE_URL 없이 동작한다(확인함).
      - name: drizzle 마이그레이션이 schema.ts와 동기화돼 있는지 확인
        timeout-minutes: 5
        run: |
          pnpm db:generate < /dev/null
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            echo "::error::schema.ts가 바뀌었는데 drizzle/ 마이그레이션이 갱신되지 않았다. 로컬에서 'pnpm db:generate'를 돌리고 결과를 커밋할 것."
            git status --porcelain -- drizzle
            git --no-pager diff -- drizzle
            exit 1
          fi
      # 판정 정확도 게이트. recall < 95% 또는 precision < 90%면 빌드가 막힌다.
      # 설계 ③: 검증하지 않은 숫자는 주장일 뿐이다. 판정기가 틀리면 고객에게
      # 보내는 숫자 전체가 거짓말이고, 고객은 자기 브랜드니까 금방 알아챈다.
      #
      # ★ 이 스텝은 **실제 판정 API를 부르므로 실행마다 돈이 나간다** (라벨
      #   200건 = 약 20원). 그래서 pnpm test와 분리해 두었다.
      #   조용히 건너뛰지 않는다 — 키가 없으면 실패한다. 게이트가 꺼진 채
      #   초록불이 뜨는 것이 게이트가 없는 것보다 나쁘다.
      #
      #   저장소 Settings > Secrets and variables > Actions 에
      #   ANTHROPIC_API_KEY를 등록해야 한다.
      - name: 골드 라벨 회귀 (판정 정확도 게이트)
        timeout-minutes: 15
        run: pnpm test:golden
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # 브라우저에서만 드러나는 것을 본다 — 폼이 무엇을 직렬화해 보내는가,
      # 서버가 돌려준 오류 문구가 실제로 화면에 뜨는가, 라우터가 어디로 미는가.
      #
      # ★ 신청 성공 경로는 `page.route`로 가로챈다. 실제로 밟으면 DB에 행이
      #   생기고 Resend가 존재하지 않는 주소로 메일을 보내 **발송 도메인 평판이
      #   깎인다.** 자세한 이유는 스펙 파일 상단에 적어 두었다.
      #
      # ★ 그래도 DATABASE_URL은 진짜여야 한다 — "발송되지 않은 리포트 링크는
      #   404다" 테스트가 DB를 한 번 읽는다. 더미 URL이면 그 페이지가 500이 되고
      #   테스트는 원인과 무관하게 실패한다. **읽기 한 번뿐이고 쓰기는 없다.**
      #   저장소 Settings > Secrets and variables > Actions 에 DATABASE_URL을
      #   등록해야 한다(ANTHROPIC_API_KEY와 같은 방식).
      - name: Playwright 브라우저 설치
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E (신청 → 인증 안내)
        timeout-minutes: 10
        run: pnpm test:e2e
        env:
          CI: 'true'
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ci-dummy-secret-not-used-at-runtime
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          RESEND_API_KEY: re_ci_dummy
          EMAIL_FROM: Cited <noreply@example.com>
      - run: pnpm build
        env:
          # 빌드만 통과시키기 위한 더미. 실제 값이 아니어야 한다.
          DATABASE_URL: postgres://user:pass@localhost:5432/db
          BETTER_AUTH_SECRET: ci-dummy-secret-not-used-at-runtime
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          RESEND_API_KEY: re_ci_dummy
          EMAIL_FROM: Cited <noreply@example.com>
